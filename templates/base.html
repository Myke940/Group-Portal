<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<header>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'group-detail' %}">Group Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="#">Forum</a>
        <a class="nav-link" href="#">Group
        </a>
        <a class="nav-link" href="#">Votes</a>
        <a class="nav-link" href="#">Announcements</a>
        <a class="nav-link" href="{% url 'materials:'material-list' %}">Materials</a>
        <a class="nav-link disabled" aria-disabled="true">Members</a>
        {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'user-profile' %}">View Profile</a>
            <a class="nav-link" href="{% url 'logout' %}">Log out</a>
        {% else %}
            <a class="nav-link" href="{% url 'login' %}">Log in</a>
            <a class="nav-link" href="{% url 'register-profile' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>    

</header>
<main>
    <div class="container-fluid mt-4">
    {% block content %}
    
    {% endblock %}
    </div>  
</main>

<footer>




</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
