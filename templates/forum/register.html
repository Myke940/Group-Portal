{% extends "base.html" %}
{% block title %}Registrieren{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
        <h3 class="text-center mb-4">Register here!</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success w-100 mt-2">create account</button>
        </form>

        <div class="text-center mt-3">
            <small>already have an account<a href="{% url 'login' %}">Log in here</a></small>
        </div>
    </div>
</div>
{% endblock %}
