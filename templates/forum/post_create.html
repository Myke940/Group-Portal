{% extends "base.html" %}
{% block title %}Beitrag erstellen{% endblock %}

{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div class="card shadow p-4" style="max-width: 600px; width: 100%;">
        <h3 class="text-center mb-4">Create Post</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-primary w-100 mt-2">Post</button>
        </form>
    </div>
</div>
{% endblock %}
