{% extends 'base.html' %}

{% block content %}
    <h1>Delete learning material</h1>
    <p>Are you sure you want to delete "{{ object.title }}"?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'materials:material-list' %}">Back to list of materials</a>
    </form>
{% endblock %}
