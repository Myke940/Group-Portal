{% extends 'base.html' %}

{% block content %}
    <h1>{% if form.instance.pk %}Edit learning material{% else %}Add new learning material{% endif %}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'materials:material-list' %}">Back to list of materials</a>
{% endblock %}
