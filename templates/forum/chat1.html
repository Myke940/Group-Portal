{% extends "base.html" %}
{% block content %}

<style>
    .chat-input {
        position: fixed;
        bottom: 20px;
        left: 2%;
        width: 80%;
        padding: 10px;
        background: white;
        border-top: 1px solid #ccc;
    }

    .send-btn{
        position: fixed;
        bottom: 20px;
        left: 85%;
        width: 120px;
        padding: 10px;
    }

    .card-y{
        position: fixed;
        height: 60px;
        bottom: 15px;
        width : 91%;
        left : 1%;

    }

    .AtTheEnd{
        height: 77vh;        
        overflow-y: auto;    
        padding: 10px;
    }

    .Name{
        font-weight: bold;
        color: #007bff;
    }

    .Probyl{
        left : 85%;

    }

    .card-body {
        padding: 0.75rem 1rem;
    }
</style>

<div class = 'AtTheEnd'>
    {% for message in messages%}
        <div class="card mb-2">
            <div class="card-body position-relative">
                <small class="text-muted position-absolute top-0 end-0 me-2 mt-1">
                    {{ message.timestamp|date:"H:i" }}
                </small>
                <p class="Name mb-1">{{ message.username }}</p>
                <p class="mb-0">{{ message.text }}</p>
            </div>
        </div>
    {% endfor %}
</div>

{% if user.is_authenticated %}
    <form method = 'post'>
        {% csrf_token %}
        <div class = 'card card-y' >
            <div class = 'card-body'>
                <input type = 'text'  class = 'chat-input' name = 'text' placeholder = 'Write'>
                <button type = 'submit' class = 'btn btn-primary w-100s send-btn' >->></button>
            </div>
        </div>
    </form>

{% else %}
    <form method = 'get' action="{% url 'login' %}">
        {% csrf_token %}
        <div class = 'card card-y' >
            <div class = 'card-body'>
                <input type = 'text'  class = 'chat-input' name = 'text' placeholder = 'Login there to write'>
                <button type = 'submit' class = 'btn btn-primary w-100s send-btn' >Log in ->></button>
            </div>
        </div>
    </form>
{% endif %}

<script>
    // Прокручуємо вниз одразу після завантаження сторінки
    function scrollToBottom() {
        const chatContainer = document.querySelector('.AtTheEnd');
        if (chatContainer) {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
    // Виконуємо при завантаженні сторінки
    window.addEventListener('load', scrollToBottom);
</script>
{% endblock %}
