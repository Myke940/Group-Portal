{% extends "base.html" %}
{% block title %}Announcements{% endblock %}

{% block content %}
<h1 class="mb-4">Announcements</h1>

{% for post in posts %}
<div class="card mb-3 shadow-sm">
    <div class="card-body">

        <h4 class="mb-2">
            <a href="{% url 'post_detail' post.id %}" class="text-decoration-none">
                {{ post.title }}
            </a>
        </h4>

        <p class="text-muted">{{ post.content|truncatewords:25 }}</p>

        <div class="d-flex align-items-center mt-3">

            <strong class="me-3">Score: {{ post.score }}</strong>

            <form action="{% url 'vote' post.id %}" method="post" class="me-2">
                {% csrf_token %}
                <button name="value" value="1" class="btn btn-success btn-sm">Like</button>
            </form>

            <form action="{% url 'vote' post.id %}" method="post">
                {% csrf_token %}
                <button name="value" value="-1" class="btn btn-danger btn-sm">Dislike</button>
            </form>

        </div>

    </div>
</div>
{% empty %}
<p>.</p>
{% endfor %}
{% endblock %}
